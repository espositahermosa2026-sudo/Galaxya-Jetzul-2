<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Jetzul Adaly - Mi Universo</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0714; overflow:hidden; font-family:'Poppins',sans-serif; height:100vh; width:100vw;}
#canvas{position:fixed; top:0; left:0; width:100%; height:100%;}
#ui{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; pointer-events:none;}
.card{pointer-events:auto; background:rgba(255,255,255,0.07); backdrop-filter:blur(14px); border:1px solid rgba(255,215,0,0.25); border-radius:24px; padding:30px 26px; text-align:center; max-width:380px; width:90%; box-shadow:0 8px 32px rgba(168,85,247,0.35);}
h1{font-family:'Dancing Script',cursive; font-size:2.3rem; color:#ffd700; text-shadow:0 0 18px #a855f7;}
h1 span{color:#fff; display:block; font-size:2.7rem; margin-top:4px;}
.msg{color:#f3e8ff; font-size:0.96rem; line-height:1.6; margin:16px 0;}
.name{font-family:'Dancing Script',cursive; font-size:1.9rem; color:#e9d5ff;}
.btn{margin-top:18px; background:linear-gradient(135deg,#a855f7,#ffd700); color:#1a102e; border:none; padding:12px 26px; border-radius:50px; font-weight:600; cursor:pointer;}
#hint{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.6); font-size:0.78rem; background:rgba(0,0,0,0.45); padding:6px 12px; border-radius:20px;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui"><div class="card">
<h1>Mi universo eres tú <span>Jetzul Adaly</span></h1>
<p class="msg">Si pudiera regalarte el universo, lo haría. Pero como no puedo, te hice una galaxia donde cada estrella lleva tu nombre y cada flor amarilla es un te amo. Eres mi todo.</p>
<div class="name">Galaxya 🌻💜</div>
<button class="btn" id="btn">🎵 Toca para nuestra canción</button>
</div></div>
<div id="hint">Toca la pantalla 💜🌻</div>
<audio id="audio" loop src="https://files.catbox.moe/o3a8da.mp3" preload="auto"></audio>
<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), audio=document.getElementById('audio'), btn=document.getElementById('btn'), hint=document.getElementById('hint');
let w,h,stars=[],flowers=[],t=0, playing=false;
function rs(){w=canvas.width=innerWidth; h=canvas.height=innerHeight} addEventListener('resize',rs); rs();
for(let i=0;i<350;i++) stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+0.2,c:Math.random()>0.6?'#ffd700':'#c084fc',vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,a:Math.random()*0.7+0.3});
for(let i=0;i<120;i++){let ang=Math.random()*Math.PI*2, rad=Math.random()*Math.min(w,h)*0.38; flowers.push({x:Math.random()*w,y:h+Math.random()*h,tx:w/2+Math.cos(ang)*rad,ty:h/2+Math.sin(ang)*rad*0.7,size:6+Math.random()*9,s:0.015+Math.random()*0.025,d:Math.random()*3,ph:Math.random()*6.28})}
function drawFlower(x,y,s){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*0.001+x)*0.15);ctx.fillStyle='#ffd700';for(let i=0;i<5;i++){ctx.rotate(Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-s*0.6,s*0.5,s*0.8,0,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#ff8f00';ctx.beginPath();ctx.arc(0,0,s*0.3,0,Math.PI*2);ctx.fill();ctx.restore();}
function loop(){t+=16;ctx.fillStyle='rgba(11,7,20,0.28)';ctx.fillRect(0,0,w,h);stars.forEach(s=>{s.x+=s.vx; s.y+=s.vy; if(s.x<0||s.x>w)s.vx*=-1; if(s.y<0||s.y>h)s.vy*=-1; ctx.fillStyle=s.c; ctx.globalAlpha=s.a*(0.6+Math.sin(t*0.002+s.x)*0.4); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();});ctx.globalAlpha=1;flowers.forEach(f=>{if(t*0.001>f.d){f.x+=(f.tx-f.x)*f.s; f.y+=(f.ty-f.y)*f.s;} drawFlower(f.x,f.y,f.size);});requestAnimationFrame(loop);} loop();
function toggle(){if(playing){audio.pause(); playing=false; btn.textContent='🎵 Toca para nuestra canción';}else{audio.play().then(()=>{playing=true; btn.textContent='⏸️ Pausar'; hint.style.display='none';});}} btn.onclick=toggle; document.body.addEventListener('click',e=>{if(e.target!==btn && !playing) toggle();},{once:true});
</script>
</body>
</html>
