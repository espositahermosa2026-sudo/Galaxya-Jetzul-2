<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Jetzul Adaly - Mi Universo</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;width:100vw;overflow:hidden;background:#000;font-family:'Poppins',sans-serif}
.bg{position:fixed;inset:0;background:url('esposa.jpg') center top / cover no-repeat;filter:brightness(0.5);z-index:1;transform:scale(1.05)}
.overlay{position:fixed;inset:0;background:radial-gradient(circle at center,rgba(120,0,80,0.25) 0%,rgba(0,0,0,0.85) 75%);z-index:2}
.hearts{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.heart{position:absolute;bottom:-50px;animation:rise linear forwards;filter:drop-shadow(0 0 8px rgba(255,105,180,0.8))}
@keyframes rise{0%{transform:translateY(0) translateX(0) rotate(0deg) scale(0.5);opacity:0}10%{opacity:1}100%{transform:translateY(-115vh) translateX(40px) rotate(360deg) scale(1.3);opacity:0}}
.content{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.photo{width:165px;height:165px;border-radius:50%;border:4px solid white;box-shadow:0 0 30px #ff69b4,0 0 60px rgba(255,105,180,0.6);object-fit:cover;object-position:center top}
h1{margin-top:18px;font-family:'Great Vibes',cursive;color:#ff9ed2;font-size:2.2rem;text-shadow:0 0 15px #ff1493}
h1 span{color:#fff;display:block;font-size:3rem;line-height:1}
.msg{margin-top:12px;color:#ffe4f0;font-size:0.95rem;line-height:1.6;max-width:360px;background:rgba(0,0,0,0.45);backdrop-filter:blur(10px);padding:14px 16px;border-radius:18px;border:1px solid rgba(255,182,193,0.3)}
.sig{margin-top:14px;font-family:'Great Vibes',cursive;color:#ffb6d9;font-size:2.2rem}
.btn{margin-top:16px;background:linear-gradient(135deg,#ff69b4,#ff1493);color:white;border:none;padding:12px 26px;border-radius:50px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(255,20,147,0.5);pointer-events:auto}
#tap{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at center,#2a0a2a 0%,#000 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:1s;text-align:center;color:#ffb6d9}
#tap.hidden{opacity:0;pointer-events:none}
#tap h2{font-family:'Great Vibes',cursive;font-size:3.4rem;color:#ff8ac6;text-shadow:0 0 20px #ff1493}
.music{position:fixed;top:12px;right:12px;z-index:10;background:rgba(255,105,180,0.3);backdrop-filter:blur(8px);padding:6px 12px;border-radius:20px;font-size:0.75rem;color:white;display:none}
.music.show{display:block}
</style>
</head>
<body>
<div class="bg"></div><div class="overlay"></div>
<div class="hearts" id="hearts"></div>
<div class="music" id="mtag">💖 Nuestra canción sonando</div>

<div id="tap"><h2>Para ti<br>Jetzul Adaly 💜</h2><p style="margin-top:10px;color:#e0c0d0">Mi universo entero</p><button class="btn" id="initBtn" style="margin-top:28px">💖 TOCA PARA INICIAR 💖</button></div>

<div class="content">
<img class="photo" src="esposa.jpg" alt="Jetzul Adaly">
<h1>Mi universo eres tú <span>Jetzul Adaly</span></h1>
<div class="msg">Si pudiera regalarte el universo, lo haría. Pero como no puedo, te hice esto donde cada corazón que ves es un te amo que te guardo. Eres mi todo, mi siempre, mi para siempre.</div>
<div class="sig">Edgar Daniel 💜</div>
<button class="btn" id="musicBtn">🎵 Toca para nuestra canción</button>
</div>

<audio id="audio" loop preload="auto" src="https://files.catbox.moe/o3a8da.mp3"></audio>

<script>
const hearts=document.getElementById('hearts');
function spawnHeart(){
const h=document.createElement('div');h.className='heart';
const icons=['💖','💜','💕','💗','❤️','💞','💓'];
h.textContent=icons[Math.floor(Math.random()*icons.length)];
h.style.left=Math.random()*100+'vw';
h.style.fontSize=(18+Math.random()*28)+'px';
h.style.animationDuration=(3+Math.random()*4.5)+'s';
hearts.appendChild(h);
setTimeout(()=>h.remove(),7500);
}
setInterval(spawnHeart,150);

const audio=document.getElementById('audio'),tap=document.getElementById('tap'),initBtn=document.getElementById('initBtn'),musicBtn=document.getElementById('musicBtn'),mtag=document.getElementById('mtag');
let playing=false;
function playMusic(){
audio.play().then(()=>{playing=true;musicBtn.textContent='⏸️ Pausar';mtag.classList.add('show')}).catch(()=>{});
}
function pauseMusic(){
audio.pause();playing=false;musicBtn.textContent='🎵 Toca para nuestra canción';mtag.classList.remove('show')
}
initBtn.onclick=()=>{tap.classList.add('hidden');playMusic()};
musicBtn.onclick=()=>{playing?pauseMusic():playMusic()};
</script>
</body>
</html>
