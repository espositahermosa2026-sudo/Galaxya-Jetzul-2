<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día de las Flores Amarillas - Jetzul Adaly</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at center,#4a3a0a 0%,#1a1400 40%,#050300 100%);overflow:hidden;height:100vh;width:100vw;font-family:'Poppins',sans-serif}
canvas{position:fixed;inset:0;z-index:1}
.center{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;display:flex;flex-direction:column;align-items:center}
.planetWrap{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;width:480px;height:120px;top:62%;left:50%;transform:translate(-50%,-50%) rotateX(75deg);border-radius:50%;background:repeating-linear-gradient(90deg,#ffeb3b 0px,#fff176 8px,#ffb300 16px,#ffeb3b 24px);box-shadow:0 0 40px #ffeb3b,0 0 80px rgba(255,235,59,0.6);z-index:1;animation:ringSpin 8s linear infinite}
@keyframes ringSpin{0%{filter:brightness(1)}50%{filter:brightness(1.3)}100%{filter:brightness(1)}}
.planet{position:absolute;width:210px;height:210px;background:radial-gradient(circle at 30% 30%,#222,#000 70%);border-radius:50%;top:55%;left:50%;transform:translate(-50%,-50%);z-index:3;box-shadow:inset -20px -10px 30px rgba(0,0,0,1),0 0 20px rgba(0,0,0,0.8)}
.flowerMain{position:absolute;z-index:4;bottom:52%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.stem{width:10px;height:90px;background:linear-gradient(to bottom,#6abf59,#2e7d32);border-radius:5px;margin-top:-10px;position:relative}
.leaf{position:absolute;width:58px;height:32px;background:linear-gradient(135deg,#7ecb6f,#3a9a2e);border-radius:0 100% 0 100%;top:30px}
.leaf.l1{left:-50px;transform:rotate(-25deg)} .leaf.l2{right:-50px;transform:rotate(25deg) scaleX(-1)}
.sun{position:relative;width:170px;height:170px}
.petal{position:absolute;width:42px;height:75px;background:linear-gradient(to top,#ffb300,#ffeb3b);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;left:50%;top:50%;transform-origin:50% 100%;box-shadow:0 0 8px rgba(255,235,59,0.6)}
.centerPhoto{position:absolute;width:72px;height:72px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;border:3px solid #5d4037;z-index:5;box-shadow:0 0 15px rgba(0,0,0,0.8)}
.centerPhoto img{width:100%;height:100%;object-fit:cover}
.texts{position:fixed;inset:0;z-index:6;pointer-events:none}
.t{position:absolute;color:#fff9c4;font-size:0.72rem;white-space:nowrap;text-shadow:0 0 8px #ffb300;font-family:'Poppins',sans-serif;opacity:0.9;animation:floatTxt 12s linear infinite}
.t b{color:#ffeb3b}
.t.big{font-family:'Dancing Script',cursive;font-size:1.9rem;color:#fff;text-shadow:0 0 15px #ffeb3b,0 0 30px #ff9800;white-space:nowrap}
.t.big2{font-family:'Dancing Script',cursive;font-size:2.1rem;color:#ffeb3b}
@keyframes floatTxt{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(-15px) rotate(2deg)}}
.topTitle{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10;font-family:'Dancing Script',cursive;color:#ffeb3b;font-size:2rem;text-align:center;text-shadow:0 0 20px #ff9800,0 0 40px #ffeb3b;white-space:nowrap}
.mainMsg{margin-top:8px;font-family:'Dancing Script',cursive;color:#fff;font-size:2.2rem;text-shadow:0 0 15px #ffb300;white-space:nowrap;z-index:10}
.bottomMsg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;font-family:'Dancing Script',cursive;color:#ffe082;font-size:1.5rem;text-align:center;text-shadow:0 0 10px #000;white-space:nowrap}
.bouquet{position:fixed;z-index:4;font-size:52px;filter:drop-shadow(0 0 10px rgba(255,235,59,0.5));pointer-events:none}
#tap{position:fixed;inset:0;z-index:50;background:radial-gradient(circle,#3a2a08,#050300);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#ffeb3b;transition:1s}
#tap.hidden{opacity:0;pointer-events:none}
.btn{margin-top:18px;padding:12px 28px;border:2px solid #ffeb3b;border-radius:30px;background:rgba(255,235,59,0.15);color:#ffeb3b;cursor:pointer}
</style>
</head>
