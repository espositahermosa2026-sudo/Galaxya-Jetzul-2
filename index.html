<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Jetzul Adaly</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070010;overflow:hidden;height:100vh;width:100vw}
canvas{position:fixed;inset:0;z-index:1}
.content{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;pointer-events:none}
.photoWrap{position:relative;width:165px;height:165px;pointer-events:auto}
.ring{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(#ffeb3b,#ff00ff,#ab47bc,#ffeb3b);animation:spin 3s linear infinite;filter:blur(0.5px)}
@keyframes spin{to{transform:rotate(360deg)}}
.photoWrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid white;z-index:2;box-shadow:0 0 25px #ffeb3b}
.card{margin-top:14px;background:rgba(15,5,25,0.45);backdrop-filter:blur(6px);border:1px solid rgba(255,235,59,0.35);border-radius:26px;padding:18px 18px;max-width:360px;width:92%;text-align:center;pointer-events:auto;box-shadow:0 0 30px rgba(0,0,0,0.7)}
h1{font-family:'Great Vibes',cursive;color:#ffeb3b;font-size:1.9rem;text-shadow:0 0 15px #ff9800}
h1 span{color:#fff;display:block;font-size:2.7rem}
.msg{color:#f0e6ff;font-size:0.90rem;line-height:1.55;margin-top:10px;font-family:'Poppins',sans-serif}
.sig{font-family:'Great Vibes',cursive;color:#d9a6ff;font-size:2rem;margin-top:10px}
.btn{margin-top:14px;background:linear-gradient(135deg,#d57ee3,#ffeb3b);color:#2d0a3a;border:none;padding:11px 24px;border-radius:50px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif}
#tap{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at center,#1c0a32 0%,#05000a 85%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:1s}
#tap.hidden{opacity:0;pointer-events:none}
#tap h2{font-family:'Great Vibes',cursive;color:#ffeb3b;font-size:3.3rem;text-align:center}
.flowers{position:fixed;inset:0;z-index:2;pointer-events:none}
.flower{position:absolute;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg) scale(0.5);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(110vh) rotate(360deg) scale(1.1);opacity:0}}
</style>
</head>
<body>
<canvas id="galaxy"></canvas>
<div class="flowers" id="flowers"></div>

<div id="tap"><h2>Mi Galaxia Eres Tú<br>🌻</h2><p style="color:#d0c0e0;margin-top:10px">Para Jetzul Adaly</p><button class="btn" id="initBtn">✨ TOCA PARA INICIAR ✨</button></div>

<div class="content">
<div class="photoWrap"><div class="ring"></div><img src="esposa.jpg" alt="Jetzul Adaly"></div>
<div class="card">
<h1>Mi universo eres tú <span>Jetzul Adaly</span></h1>
<p class="msg">Si pudiera regalarte el universo, lo haría. Pero como no puedo, te hice una galaxia donde cada estrella lleva tu nombre y cada flor amarilla es un te amo. Eres mi todo.</p>
<div class="sig">Galaxya 🌻💜</div>
<button class="btn" id="musicBtn">🎵 Toca para nuestra canción</button>
</div>
</div>

<div id="yt" style="position:fixed;width:1px;height:1px;opacity:0"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const canvas=document.getElementById('galaxy'),ctx=canvas.getContext('2d'),flowers=document.getElementById('flowers');
let w,h,particles=[],cx,cy,player,ready=false;
function rs(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;cx=w/2;cy=h/2}rs();addEventListener('resize',rs);
function onYouTubeIframeAPIReady(){player=new YT.Player('yt',{height:'1',width:'1',videoId:'Z1c3SXLmAUg',playerVars:{autoplay:0,loop:1,playlist:'Z1c3SXLmAUg'},events:{onReady:e=>{ready=true;e.target.setVolume(75)}}})}
class P{constructor(a,r,s,c){this.a=a;this.r=r;this.s=s;this.c=c;this.sz=Math.random()*7+4;this.isFlower=Math.random()<0.65}up(){this.a+=this.s;this.x=cx+Math.cos(this.a)*this.r;this.y=cy+Math.sin(this.a)*this.r*0.6}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.a);ctx.fillStyle=this.c;ctx.shadowBlur=12;ctx.shadowColor=this.c;if(this.isFlower){for(let i=0;i<5;i++){ctx.rotate(6.283/5);ctx.beginPath();ctx.ellipse(0,this.sz/2,this.sz/2,this.sz,0,0,6.283);ctx.fill()}ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(0,0,this.sz/3,0,6.283);ctx.fill()}else{ctx.beginPath();ctx.arc(0,0,this.sz/2.5,0,6.283);ctx.fill()}ctx.restore()}}
for(let i=0;i<450;i++){let r=Math.random()*Math.min(w,h)*0.52+30;let a=Math.random()*6.283+r*0.008;let s=0.0008+Math.random()*0.0022;let c=Math.random()<0.55?'#ffeb3b':'#ab47bc';particles.push(new P(a,r,s,c))}
function loop(){ctx.fillStyle='rgba(7,0,16,0.32)';ctx.fillRect(0,0,w,h);ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,32,0,6.283);ctx.fill();particles.forEach(p=>{p.up();p.draw()});requestAnimationFrame(loop)}loop();
function spawnFlower(){const f=document.createElement('div');f.className='flower';f.textContent=Math.random()<0.5?'🌻':'🌼';f.style.left=Math.random()*100+'vw';f.style.fontSize=(16+Math.random()*22)+'px';f.style.animationDuration=(4+Math.random()*5)+'s';flowers.appendChild(f);setTimeout(()=>f.remove(),9000)}setInterval(spawnFlower,280);
const tap=document.getElementById('tap'),initBtn=document.getElementById('initBtn'),musicBtn=document.getElementById('musicBtn');
let playing=false;
function start(){tap.classList.add('hidden');if(ready&&!playing){player.playVideo();playing=true;musicBtn.textContent='⏸️ Pausar'}}
initBtn.onclick=start;
musicBtn.onclick=()=>{if(!ready)return;if(playing){player.pauseVideo();playing=false;musicBtn.textContent='🎵 Toca para nuestra canción'}else{player.playVideo();playing=true;musicBtn.textContent='⏸️ Pausar'}};
</script>
</body>
</html>
